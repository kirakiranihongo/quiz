<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Menu Kuis – Kirakira Nihongo</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

<style>
body {
  font-family:"Noto Sans JP",sans-serif;
  background:linear-gradient(135deg,#f7dde2,#d7eaf8,#e6d9f8);
  padding:30px;
}

.container {
  max-width:900px;
  margin:auto;
  background:#fff;
  padding:25px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

h2 {
  text-align:center;
  color:#2f3a56;
  margin-bottom:20px;
}

.menu-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:15px;
  margin-top:20px;
}

.menu-btn {
  padding:15px;
  background:#2f3a56;
  color:white;
  border:none;
  border-radius:12px;
  font-size:16px;
  cursor:pointer;
  transition:0.2s;
}

.menu-btn:hover {
  background:#445075;
  transform:scale(1.05);
}

.logout-btn {
  margin-top:30px;
  padding:12px 20px;
  background:#d9534f;
  color:white;
  border:none;
  border-radius:10px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="container">
  <h2>Menu Kuis Kirakira Nihongo</h2>

  <div class="menu-grid" id="menuBab"></div>

  <button class="logout-btn" onclick="location.href='index.html'">Kembali ke Beranda</button>
</div>

<script>
// AUTO-GENERATE TOMBOL BAB 1–25
const menu = document.getElementById("menuBab");

for (let i = 1; i <= 25; i++) {
  menu.innerHTML += `
    <a href="bab${i}.html">
      <button class="menu-btn">Kuis Bab ${i}</button>
    </a>
  `;
}
</script>

</body>
</html>
