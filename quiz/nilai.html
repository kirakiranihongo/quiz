<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Nilai Murid – Kirakira Nihongo</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script type="module" src="firebase.js"></script>

<style>
body {
  font-family:"Noto Sans JP",sans-serif;
  background:linear-gradient(135deg,#f7dde2,#d7eaf8,#e6d9f8);
  padding:30px;
}
.container {
  max-width:1000px;margin:auto;background:#fff;padding:25px;border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.15);
}
.badge {
  display:inline-block;background:#ffd966;padding:8px 14px;border-radius:999px;margin:5px;font-weight:bold;
}
button {
  margin-top:20px;padding:12px;border-radius:10px;border:none;background:#2f3a56;color:white;cursor:pointer;
}
canvas {
  margin-bottom:40px;
}
</style>
</head>

<body>

<div class="container">
  <h2 style="color:#2f3a56;">Nilai Murid – Kirakira Nihongo</h2>
  <p id="nama"></p>

  <h3>📘 Nilai Semua Bab (1–25)</h3>
  <div id="nilaiList"></div>

  <h3>📊 Grafik Semua Bab</h3>
  <canvas id="chartAll"></canvas>

  <h3>📊 Grafik Per Bab</h3>
  <div id="grafikPerBab"></div>

  <h3>🎌 Level Kirakira Nihongo</h3>
  <p id="level"></p>

  <h3>🏅 Badge Pencapaian</h3>
  <div id="badgeBox"></div>

  <h3>📈 Progress Belajar</h3>
  <p id="progress"></p>

  <h3>⭐ Ranking Pribadi</h3>
  <p id="rank"></p>

  <button onclick="location.href='quiz.html'">Kembali ke Menu</button>
</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { get, ref } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const totalBab = 25;

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    document.getElementById("nama").innerText = "Silakan login terlebih dahulu.";
    return;
  }

  document.getElementById("nama").innerText = "Nama: " + user.email;

  const nilaiListDiv = document.getElementById("nilaiList");
  const nilaiSemuaBab = [];

  const snap = await get(ref(db, "nilai/" + user.uid));

  for (let i = 1; i <= totalBab; i++) {
    const babKey = "bab" + i;
    const data = snap.child(babKey).val();

    const nilai = data ? data.nilai : 0;
    nilaiSemuaBab.push(nilai);

    nilaiListDiv.innerHTML += `
      <p><b>Bab ${i}:</b> ${nilai > 0 ? nilai : "Belum ada nilai"}</p>
    `;
  }

  // ===============================
  // GRAFIK SEMUA BAB
  // ===============================
  new Chart(document.getElementById("chartAll"), {
    type: 'bar',
    data: {
      labels: Array.from({length: totalBab}, (_,i)=>"Bab "+(i+1)),
      datasets: [{
        label: "Nilai",
        data: nilaiSemuaBab,
        backgroundColor: "#f7a8b8"
      }]
    }
  });

  // ===============================
  // GRAFIK PER BAB
  // ===============================
  const grafikContainer = document.getElementById("grafikPerBab");

  for (let i = 1; i <= totalBab; i++) {
    if (nilaiSemuaBab[i-1] > 0) {

      grafikContainer.innerHTML += `
        <h4>Grafik Bab ${i}</h4>
        <canvas id="chartBab${i}"></canvas>
      `;

      new Chart(document.getElementById(`chartBab${i}`), {
        type: 'bar',
        data: {
          labels: [`Bab ${i}`],
          datasets: [{
            label: `Nilai Bab ${i}`,
            data: [nilaiSemuaBab[i-1]],
            backgroundColor: "#a8d8f7"
          }]
        }
      });
    }
  }

  // ===============================
  // PROGRESS
  // ===============================
  const babSelesai = nilaiSemuaBab.filter(n => n > 0).length;
  const progressPersen = Math.round((babSelesai / totalBab) * 100);
  document.getElementById("progress").innerText = `${babSelesai} dari ${totalBab} bab selesai (${progressPersen}%)`;

  // ===============================
  // LEVEL
  // ===============================
  const totalNilai = nilaiSemuaBab.reduce((a,b)=>a+b,0);
  let level = "Level Sakura 1";

  if (totalNilai >= 600) level = "Level Sakura 5";
  else if (totalNilai >= 500) level = "Level Sakura 4";
  else if (totalNilai >= 400) level = "Level Sakura 3";
  else if (totalNilai >= 300) level = "Level Sakura 2";

  document.getElementById("level").innerText = level;

  // ===============================
  // BADGE
  // ===============================
  const badgeBox = document.getElementById("badgeBox");

  if (progressPersen >= 100) badgeBox.innerHTML += `<span class="badge">Master Kirakira</span>`;
  if (progressPersen >= 50) badgeBox.innerHTML += `<span class="badge">Halfway Hero</span>`;
  if (babSelesai >= 1) badgeBox.innerHTML += `<span class="badge">First Step</span>`;

  // ===============================
  // RANKING
  // ===============================
  let rank = "Pemula Kirakira";
  if (totalNilai >= 600) rank = "Samurai Nihongo";
  else if (totalNilai >= 450) rank = "Fuji Learner";
  else if (totalNilai >= 300) rank = "Sakura Learner";

  document.getElementById("rank").innerText = rank;
});
</script>

</body>
</html>
