<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Kuis Bab 1 – Kirakira Nihongo</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

<style>
body { font-family:"Noto Sans JP"; background:#f7d2e2; padding:20px; }
.container { max-width:800px; margin:auto; background:#fff; padding:25px; border-radius:20px; }
.question { margin-bottom:15px; }
.options label { display:block; }
button { margin-top:20px; padding:12px; background:#2f3a56; color:white; border:none; border-radius:10px; }
.result { margin-top:20px; font-weight:bold; }
</style>
</head>

<body>
<div class="container">
<h2>Kuis Bab 1 – Kirakira Nihongo</h2>

<div id="soal"></div>

<button onclick="kumpulkan()">Kumpulkan Jawaban</button>
<div id="hasil"></div>

<button onclick="location.href='quiz.html'">Kembali ke Menu</button>
</div>

<script type="module">
import { saveScore } from "../firebase.js";

const soal = [
  {q:"これは なんですか。", opts:["ほん","いぬ","ねこ","くるま"], ans:"a"},
  {q:"それは なんですか。", opts:["つくえ","いす","かばん","ほん"], ans:"c"},
  {q:"あれは なんですか。", opts:["でんわ","ほん","テレビ","ラジオ"], ans:"c"},
];

function render() {
  const div = document.getElementById("soal");
  soal.forEach((s,i)=>{
    let html = `<div class='question'><b>${i+1}.</b> ${s.q}<div class='options'>`;
    ["a","b","c","d"].forEach((l,j)=>{
      html += `<label><input type='radio' name='q${i}' value='${l}'> ${l}) ${s.opts[j]}</label>`;
    });
    html += "</div></div>";
    div.innerHTML += html;
  });
}
render();

window.kumpulkan = function() {
  let score = 0;
  soal.forEach((s,i)=>{
    const sel = document.querySelector(`input[name='q${i}']:checked`);
    if(sel && sel.value === s.ans) score++;
  });
  document.getElementById("hasil").innerText = "Nilai: " + score;

  saveScore(1, score);
}
</script>

</body>
</html>
