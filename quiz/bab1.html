<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Kuis Bab 1 – Kirakira Nihongo</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body {
    font-family: "Noto Sans JP", sans-serif;
    background: #f7dde2;
    padding: 20px;
}
.container {
    max-width: 700px;
    margin: auto;
    background: #fff;
    padding: 25px;
    border-radius: 20px;
}
button {
    padding: 12px 20px;
    background: #2f3a56;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 15px;
}
button:hover {
    background: #445075;
}
</style>
</head>
<body>

<div class="container">
    <h2>Kuis Bab 1 – Kirakira Nihongo</h2>
    <p id="progress"></p>

    <div id="questionBox"></div>

    <button id="nextBtn" onclick="nextQuestion()">Selanjutnya</button>
    <button id="finishBtn" onclick="finishQuiz()" style="display:none; background:#d9534f;">Selesai</button>

    <div id="resultBox" style="display:none; margin-top:20px;">
        <h3>Kuis Selesai!</h3>
        <p id="scoreText"></p>
        <a href="nilai.html">
            <button style="background:#5cb85c;">Lihat Nilai</button>
        </a>
    </div>
</div>

<script src="firebase.js"></script>
<script>
// ===============================
// DATA SOAL
// ===============================
const questions = [
    {q:"わたし は たなか です。", a:"です", o:["は","を","です","に"]},
    {q:"ミラーさん は アメリカ ___ きました。", a:"から", o:["から","まで","で","を"]},
    {q:"これは ほん ___ です。", a:"です", o:["を","は","です","に"]},
    {q:"たなかさん は せんせい ___ です。", a:"です", o:["を","は","です","に"]},
    {q:"ミラーさん は にほん ___ きました。", a:"へ", o:["を","へ","で","に"]},
    {q:"これは コンピューター ___ です。", a:"です", o:["を","は","です","に"]},
    {q:"わたし は にほんじん ___ です。", a:"です", o:["を","は","です","に"]},
    {q:"ミラーさん は かいしゃ ___ いきます。", a:"へ", o:["を","へ","で","に"]},
    {q:"これは じしょ ___ です。", a:"です", o:["を","は","です","に"]},
    {q:"たなかさん は がくせい ___ です。", a:"です", o:["を","は","です","に"]},

    // Tambahkan sampai 35 soal
];
let index = 0;
let score = 0;

// ===============================
// TAMPILKAN SOAL
// ===============================
function showQuestion() {
    document.getElementById("progress").innerText = `Soal ${index+1} dari ${questions.length}`;
    const q = questions[index];

    let html = `<p><b>${q.q}</b></p>`;
    q.o.forEach(opt => {
        html += `<label><input type="radio" name="answer" value="${opt}"> ${opt}</label><br>`;
    });

    document.getElementById("questionBox").innerHTML = html;

    // Jika soal terakhir → tampilkan tombol Selesai
    if (index === questions.length - 1) {
        document.getElementById("nextBtn").style.display = "none";
        document.getElementById("finishBtn").style.display = "inline-block";
    }
}
showQuestion();

// ===============================
// NEXT QUESTION
// ===============================
function nextQuestion() {
    const selected = document.querySelector("input[name='answer']:checked");
    if (!selected) return alert("Pilih jawaban dulu!");

    if (selected.value === questions[index].a) score++;

    index++;
    showQuestion();
}

// ===============================
// FINISH QUIZ
// ===============================
function finishQuiz() {
    const selected = document.querySelector("input[name='answer']:checked");
    if (selected && selected.value === questions[index].a) score++;

    document.getElementById("questionBox").style.display = "none";
    document.getElementById("nextBtn").style.display = "none";
    document.getElementById("finishBtn").style.display = "none";

    document.getElementById("resultBox").style.display = "block";
    document.getElementById("scoreText").innerText = `Nilai Kamu: ${score} / ${questions.length}`;

    saveScore(score);
}

// ===============================
// SIMPAN NILAI KE FIREBASE
// ===============================
function saveScore(score) {
    const user = localStorage.getItem("username");
    if (!user) return;

    firebase.database().ref("nilai/" + user + "/bab1").set({
        nilai: score,
        tanggal: new Date().toISOString()
    });
}
</script>

</body>
</html>
