<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Admin – Nilai Murid</title>

<script type="module" src="firebase.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

<style>
body {
  font-family:"Noto Sans JP",sans-serif;
  background:linear-gradient(135deg,#f7dde2,#d7eaf8,#e6d9f8);
  padding:20px;
}
.container {
  max-width:900px;margin:auto;background:#fff;padding:25px;border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.15);
}
h2 { 
  color:#2f3a56;
  text-align:center;
  margin-bottom:20px;
}
table {
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}
th, td {
  border:1px solid #ccc;
  padding:10px;
  text-align:center;
}
th {
  background:#f0f4ff;
}
tr:nth-child(even){
  background:#fafafa;
}
</style>
</head>

<body>

<div class="container">
  <h2>Daftar Nilai Murid – Admin</h2>

  <table>
    <thead>
      <tr>
        <th>Nama</th>
        <th>Email</th>
        <th>Nilai Bab 1</th>
      </tr>
    </thead>
    <tbody id="data"></tbody>
  </table>
</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { get, ref } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    document.getElementById("data").innerHTML = `
      <tr><td colspan="3">Silakan login sebagai admin.</td></tr>
    `;
    return;
  }

  const snap = await get(ref(db, "users"));
  const users = snap.val();

  let html = "";

  for (let uid in users) {
    let u = users[uid];
    html += `
      <tr>
        <td>${u.name ?? "-"}</td>
        <td>${u.email ?? "-"}</td>
        <td>${u.score_bab1 ?? "Belum"} / 35</td>
      </tr>
    `;
  }

  document.getElementById("data").innerHTML = html;
});
</script>

</body>
</html>
