<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Kuis Bab 3 – Kirakira Nihongo</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script type="module" src="firebase.js"></script>

<style>
body {
  font-family:"Noto Sans JP",sans-serif;
  background:#f7d2e2;
  padding:20px;
}
.container {
  max-width:800px;
  margin:auto;
  background:#fff;
  padding:25px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.15);
}
h2 {
  text-align:center;
  color:#2f3a56;
}
h3 {
  margin-top:25px;
  color:#2f3a56;
}
.question {
  margin-bottom:15px;
}
.options label {
  display:block;
}
button {
  margin-top:20px;
  padding:12px 20px;
  border:none;
  border-radius:10px;
  background:#2f3a56;
  color:white;
  cursor:pointer;
}
.result {
  margin-top:20px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
  <h2>Kuis Bab 3 – Kirakira Nihongo</h2>

  <h3>A. Pilihan Ganda (20 soal)</h3>
  <div id="bagianA"></div>

  <h3>B. Isian (10 soal pilihan ganda)</h3>
  <div id="bagianB"></div>

  <h3>C. Membaca Pendek (5 soal)</h3>
  <p>「トイレはどちらですか。」 「あちらです。」</p>
  <div id="bagianC"></div>

  <h3>D. Susun Kalimat Acak (5 soal)</h3>
  <div id="bagianD"></div>

  <button id="submitBtn">Kumpulkan Jawaban</button>
  <div id="result" class="result"></div>

  <button onclick="location.href='quiz.html'">Kembali ke Menu Kuis</button>
</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { ref, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const soalA = [
  {q:"ここ＿＿ じむしょです。", opts:["は","を","に","が"], ans:"a"},
  {q:"トイレは どこ＿＿ ですか。", opts:["は","に","です","で"], ans:"c"},
  {q:"あそこ＿＿ きょうしつです。", opts:["は","を","に","と"], ans:"a"},
  {q:"こちら＿＿ エレベーターです。", opts:["は","を","に","が"], ans:"a"},
  {q:"そこ＿＿ かいぎしつです。", opts:["は","に","を","と"], ans:"a"},
  {q:"あのへや＿＿ ちいさいです。", opts:["は","に","を","が"], ans:"a"},
  {q:"でんわは ２かい＿＿ です。", opts:["は","に","で","を"], ans:"c"},
  {q:"やまだ先生は じむしょ＿＿ です。", opts:["に","は","を","で"], ans:"a"},
  {q:"エレベーターは どちら＿＿ ですか。", opts:["は","に","です","で"], ans:"c"},
  {q:"あちら＿＿ しょくどうです。", opts:["は","に","を","と"], ans:"a"},
  {q:"ここは 日本語の クラス＿＿ です。", opts:["に","は","です","を"], ans:"b"},
  {q:"これは ドイツ＿＿ コンピューターです。", opts:["の","に","を","が"], ans:"a"},
  {q:"パワー電機＿＿ コンピューターです。", opts:["の","に","を","と"], ans:"a"},
  {q:"がっこうは どちら＿＿ ですか。", opts:["は","に","です","で"], ans:"c"},
  {q:"こちら＿＿ かいしゃの いりぐちです。", opts:["は","に","を","が"], ans:"a"},
  {q:"あそこ＿＿ しょくどうですか。", opts:["は","に","を","と"], ans:"a"},
  {q:"ここ＿＿ うけつけです。", opts:["は","に","を","が"], ans:"a"},
  {q:"そのへや＿＿ どこですか。", opts:["は","に","を","と"], ans:"a"},
  {q:"こちら＿＿ たなかさんの へやです。", opts:["は","に","を","が"], ans:"a"},
  {q:"あのビル＿＿ どちらですか。", opts:["は","に","を","と"], ans:"a"},
];

const soalB = [
  {q:"＿＿は じむしょ ですか。", opts:["ここ","あそこ","こちら","どこ"], ans:"a"},
  {q:"がっこうは ＿＿ですか。", opts:["どこ","どちら","あそこ","こちら"], ans:"b"},
  {q:"これは 日本＿＿ コンピューターです。", opts:["の","に","を","が"], ans:"a"},
  {q:"こちらは かいぎしつ＿＿ です。", opts:["は","に","を","で"], ans:"a"},
  {q:"トイレは ＿＿ですか。", opts:["どこ","どちら","あそこ","こちら"], ans:"a"},
  {q:"あのへやは ＿＿です。", opts:["ちいさい","おおきい","どちら","どこ"], ans:"a"},
  {q:"これは パワー電機＿＿ コンピューターです。", opts:["の","に","を","が"], ans:"a"},
  {q:"ここは うけつけ＿＿ です。", opts:["は","に","を","で"], ans:"a"},
  {q:"がっこうは ＿＿です。", opts:["あちら","こちら","どちら","どこ"], ans:"a"},
  {q:"エレベーターは ＿＿ですか。", opts:["どちら","どこ","あそこ","こちら"], ans:"a"},
];

const soalC = [
  {q:"Di mana toilet?", opts:["Di sana (jauh)","Di sini","Di dekat pembicara","Tidak tahu"], ans:"a"},
  {q:"“どちら” digunakan untuk…", opts:["Menanyakan arah/tempat sopan","Menanyakan jumlah","Menanyakan waktu","Menanyakan orang"], ans:"a"},
  {q:"“あちらです” berarti…", opts:["Di sebelah sana","Di sebelah sini","Di sebelah situ","Tidak ada"], ans:"a"},
  {q:"“こちら” digunakan untuk…", opts:["Arah dekat pembicara","Arah dekat lawan bicara","Arah jauh","Arah tidak jelas"], ans:"a"},
  {q:"“これはドイツのコンピューターです” artinya…", opts:["Komputer buatan Jepang","Komputer buatan Jerman","Komputer buatan perusahaan Power","Komputer buatan Amerika"], ans:"b"},
];

const soalD = [
  {q:"は / ここ / うけつけ / です", opts:["ここは うけつけです","うけつけは ここです","はここ です うけつけ","ここです は うけつけ"], ans:"a"},
  {q:"あそこ / です / しょくどう / は", opts:["あそこは しょくどうです","しょくどうは あそこです","あそこ しょくどう はです","はあそこ です しょくどう"], ans:"a"},
  {q:"の / コンピューター / これは / 日本", opts:["これは 日本の コンピューター","日本は これは のコンピューター","コンピューター のこれは 日本","の日本 これは コンピューター"], ans:"a"},
  {q:"どちら / は / がっこう / です / か", opts:["がっこうは どちらですか","どちらは がっこうですか","はどちら がっこう ですか","がっこう です どちら はか"], ans:"a"},
  {q:"こちら / です / いりぐち / は", opts:["こちらは いりぐちです","いりぐちは こちらです","はこちら です いりぐち","こちら です は いりぐち"], ans:"a"},
];

function renderSection(containerId, questions, prefix) {
  const container = document.getElementById(containerId);
  questions.forEach((item, index) => {
    const no = index + 1;
    let html = `<div class="question">
      <div><b>${prefix}${no}.</b> ${item.q}</div>
      <div class="options">`;
    const labels = ["a","b","c","d"];
    item.opts.forEach((opt, i) => {
      html += `
        <label>
          <input type="radio" name="${prefix}${no}" value="${labels[i]}">
          ${labels[i]}) ${opt}
        </label>`;
    });
    html += `</div></div>`;
    container.innerHTML += html;
  });
}

renderSection("bagianA", soalA, "A");
renderSection("bagianB", soalB, "B");
renderSection("bagianC", soalC, "C");
renderSection("bagianD", soalD, "D");

let currentUser = null;
onAuthStateChanged(auth, (user) => {
  currentUser = user;
});

document.getElementById("submitBtn").addEventListener("click", async () => {
  let score = 0;

  function checkSection(questions, prefix) {
    questions.forEach((item, index) => {
      const no = index + 1;
      const name = `${prefix}${no}`;
      const selected = document.querySelector(`input[name="${name}"]:checked`);
      if (selected && selected.value === item.ans) {
        score += 1;
      }
    });
  }

  checkSection(soalA, "A");
  checkSection(soalB, "B");
  checkSection(soalC, "C");
  checkSection(soalD, "D");

  const resultDiv = document.getElementById("result");
  resultDiv.innerText = `Nilai kamu: ${score} / 40`;

  if (!currentUser) return;

  await set(ref(db, "nilai/" + currentUser.uid + "/bab3"), {
    nilai: score,
    tanggal: new Date().toISOString()
  });
});
</script>

</body>
</html>
