<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Login Murid - Kirakira Nihongo</title>
<style>
body {
  font-family:"Noto Sans JP",sans-serif;
  background:linear-gradient(135deg,#f7dde2,#d7eaf8,#e6d9f8);
  display:flex;justify-content:center;align-items:center;height:100vh;margin:0;
}
.container {
  background:#fff;padding:30px;border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.15);width:350px;text-align:center;
}
input {
  width:100%;padding:12px;border-radius:10px;border:1px solid #ccc;margin-bottom:15px;
}
button {
  width:100%;padding:12px;border-radius:10px;border:none;background:#2f3a56;color:white;
  font-size:16px;cursor:pointer;
}
</style>
</head>
<body>

<div class="container">
  <h2>Masuk Kelas Kirakira</h2>
  <p>Masukkan nama kamu</p>
  <input id="nama" placeholder="Nama murid">
  <button onclick="login()">Masuk</button>
</div>

<script>
function login(){
  const nama=document.getElementById("nama").value.trim();
  if(!nama){alert("Nama tidak boleh kosong");return;}
  localStorage.setItem("murid",nama);
  window.location.href="quiz.html";
}
</script>

</body>
</html>
